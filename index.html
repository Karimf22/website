<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A new website is on its way.">
  <title>My website</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #f6f5f1; color: #202c3a; }
    main { width: 100%; max-width: 42rem; padding: clamp(2rem, 7vw, 4rem); background: #fff; border: 1px solid #e5e7eb; border-radius: 1.5rem; }
    .label { margin: 0 0 1.5rem; color: #2854a3; font-size: .8rem; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.25rem, 7vw, 4rem); line-height: 1.1; letter-spacing: -.045em; }
    .message { margin: 1.5rem 0 0; color: #586372; font-size: 1.1rem; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <p class="label">Coming soon</p>
    <h1>A new beginning.</h1>
    <p class="message">My website is on its way.</p>
  </main>
</body>
</html>
